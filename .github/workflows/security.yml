name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned. A scanner that silently changes its ruleset changes what "clean"
  # means without a commit saying so.
  GITLEAKS_VERSION: '8.30.1'

jobs:
  dependencies:
    name: Backend Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Audit Composer dependencies
        # --locked is load-bearing, not decoration. Plain `composer audit`
        # audits the *installed* packages and fails outright when there is no
        # vendor/ — this job deliberately skips `composer install`, because the
        # lock file is the thing being audited and downloading it changes
        # nothing about the answer.
        run: composer audit --locked
        working-directory: backend

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the question is not "is a secret in the working tree"
          # but "was one ever committed". A shallow clone cannot answer that.
          fetch-depth: 0

      - name: Forbidden files must never be tracked
        # An explicit, dependency-free guard for the exact paths this project
        # must never publish. It fails on the *path*, so it triggers even for a
        # file whose contents no scanner would recognise.
        run: |
          set -euo pipefail

          forbidden=$(git ls-files -- \
            '.env' '*/.env' '.env.*' '*/.env.*' \
            '*.pem' '*.key' '*.p12' '*.jks' '*.keystore' \
            'google-services.json' '*/google-services.json' \
            'GoogleService-Info.plist' '*/GoogleService-Info.plist' \
            '*service-account*.json' \
            'key.properties' '*/key.properties' \
            ':!*.env.example' ':!*.env.example.*' || true)

          if [ -n "$forbidden" ]; then
            echo "::error::Files that must never be committed are tracked:"
            # Paths only. The contents are exactly what must not reach a log.
            echo "$forbidden"
            exit 1
          fi

          echo "No forbidden paths are tracked."

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for committed secrets
        # The binary rather than the marketplace action, for two reasons: this
        # is the exact command that was run locally against this history, and
        # --redact is passed explicitly rather than assumed. A secret scanner
        # that prints the secret into a build log has leaked it a second time.
        #
        # The default ruleset covers the categories this project cares about —
        # Google API keys, private keys, service-account credentials, Firebase
        # credentials, AWS keys, GitHub tokens, and generic high-entropy
        # assignments such as a JWT signing secret. .gitleaks.toml keeps all of
        # them and only describes the documentation placeholders that predate
        # this workflow.
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .
