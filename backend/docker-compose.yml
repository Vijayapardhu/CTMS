version: '3.8'

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctms_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./docker/php.ini:/usr/local/etc/php/conf.d/docker.ini
    ports:
      - "9000:9000"
    networks:
      - ctms
    depends_on:
      - postgres
      - redis
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-ctms}
      - DB_USERNAME=${DB_USERNAME:-ctms_user}
      - DB_PASSWORD=${DB_PASSWORD:-ctms_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - BROADCAST_DRIVER=reverb
      - REVERB_HOST=reverb
      - REVERB_PORT=8080

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: ctms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/app/public
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/conf.d:/etc/nginx/conf.d:ro
      - ./storage/logs/nginx:/var/log/nginx
    networks:
      - ctms
    depends_on:
      - app

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ctms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ctms}
      POSTGRES_USER: ${DB_USERNAME:-ctms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ctms_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ctms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ctms_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: ctms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ctms
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Reverb WebSocket Server
  reverb:
    image: php:8.3-cli
    container_name: ctms_reverb
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    networks:
      - ctms
    depends_on:
      - redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Database Test Container (optional)
  postgres_test:
    image: postgres:16-alpine
    container_name: ctms_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctms_test
      POSTGRES_USER: ctms_user
      POSTGRES_PASSWORD: ctms_password
    ports:
      - "5433:5432"
    networks:
      - ctms
    profiles:
      - test

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ctms:
    driver: bridge
